<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DIGILAB</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f5f5;
    overflow-x:hidden;
}

header{
    width:100%;
    height:120px;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

header h1{
    font-size:45px;
    font-weight:bold;
}

.black{
    color:#444;
}

.green{
    color:#7bc74d;
}

.services{
    width:420px;
    min-height:100vh;
    background:#7bc74d;
    padding:50px 40px;
}

.item{
    display:flex;
    align-items:center;
    gap:20px;
    margin:40px 0;
}

.item i{
    color:white;
    font-size:28px;
    width:35px;
}

.item h2{
    color:white;
    font-size:34px;
    font-weight:300;
}

.active h2{
    font-weight:bold;
}

</style>

</head>

<body>

<header>
    <h1>
        <span class="black">DIGI</span><span class="green">LAB</span>
    </h1>
</header>

<section class="services">

    <div class="item active">
        <i class="fa-solid fa-briefcase"></i>
        <h2>Business Strategy</h2>
    </div>

    <div class="item">
        <i class="fa-solid fa-flask"></i>
        <h2>Research</h2>
    </div>

    <div class="item">
        <i class="fa-solid fa-chart-line"></i>
        <h2>Data Analysis</h2>
    </div>

    <div class="item">
        <i class="fa-solid fa-pen-ruler"></i>
        <h2>UI Design</h2>
    </div>

    <div class="item">
        <i class="fa-solid fa-laptop-code"></i>
        <h2>UX Design</h2>
    </div>

    <div class="item">
        <i class="fa-solid fa-microchip"></i>
        <h2>Technology</h2>
    </div>

    <div class="item">
        <i class="fa-regular fa-lightbulb"></i>
        <h2>Creative</h2>
    </div>

</section>

</body>
</html>
